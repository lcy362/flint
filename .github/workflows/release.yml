name: Release

# 触发方式（任一即可，推荐第 1 种）：
#   1. 自动：`docs/releases/release_notes_v*.md` 随推送落到 master —— 工作流取「已写 notes 但尚未发布」
#      的最高版本发布。也就是「写 notes 即发版」，不需要再点任何按钮（见 docs/RELEASE.md）。
#   2. 手动兜底：workflow_dispatch，填版本号（可先 dry-run 演练）。
#   3. 手动兜底：推 `v*` 标签。
#
# 前置条件：notes 文件必须已存在并经人工审核（人工审核发生在它落库之前，见 docs/RELEASE.md）。
#
# 幂等与自愈：
#   - 自动触发遇到「该版本已发布且 tag 也在」→ 报「无可发布」并成功跳过（改笔记错字既不误发也不变红）；
#   - 自动触发遇到「已发布但 tag 缺失」（例如上次卡在发布审批、没走到建 tag）→ 只补 tag / Release，不重发；
#   - 显式指定（dispatch / tag）遇到已发布版本 → 直接失败，拦住误操作。
#
# 发布后校验版本是否已公开可见：**只告警**。npm 从接单到公开可见有传播延迟（v1.0.0 实测约 8 分钟），
# 因此校验超时不拦 tag / Release；真正被拒的发布会让 `npm publish` 自己以非 0 退出。
#
# npm 发布走 Trusted Publishing（OIDC），不需要配置任何 NPM_TOKEN。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不带 v 前缀，例如 1.0.0）'
        required: true
        type: string
      dry-run:
        description: '演练：只做校验与打包，不发布、不建 Release'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'
    # 自动触发的载体：release notes 落库即发布。
    # 注意：tag 推送不受 paths 过滤影响，因此上面 tags 与这里的 branches/paths 可以共存。
    branches:
      - master
    paths:
      - 'docs/releases/release_notes_v*.md'

permissions:
  contents: read

# 同一时刻只允许一次发版，避免并发导致重复发布
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify build & tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check + build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Smoke (sync / project / primary agent invariants)
        run: |
          npm run smoke -w server 2>&1 | tee /tmp/smoke.log
          ! grep -q 'FAIL' /tmp/smoke.log
          test "$(grep -c 'PASS' /tmp/smoke.log)" -ge 6

  release:
    name: Publish to npm & create GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 创建 tag / GitHub Release
      id-token: write   # npm Trusted Publishing（OIDC）所需
      packages: write   # 同步发一份到 GitHub Packages（npm.pkg.github.com）
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          # 注意：这里不设置 registry-url。
          # setup-node 会写入 _authToken=${NODE_AUTH_TOKEN}，而我们走 OIDC、没有该变量，
          # npm 遇到无法替换的变量会直接报错；OIDC 发布本身也不需要 .npmrc 里的 token。

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build publishable artifacts
        run: npm run build

      # Trusted Publishing 要求 npm >= 11.5.1；Node 22 自带的是 10.x
      - name: Upgrade npm (required for OIDC trusted publishing)
        run: npm install -g npm@latest && npm --version

      # 版本解析：三种入口统一在这里收敛，并决定本次要不要发布（skip）。
      # 统一用 registry API（带 no-cache）判断「是否已发布」，不用 npm view —— 它读本地缓存。
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail

          published() {
            curl -fsS -H 'Cache-Control: no-cache' \
              "https://registry.npmjs.org/flint-skills-hub/$1" -o /dev/null 2>/dev/null
          }
          tagged() {
            [ -n "$(git ls-remote --tags origin "refs/tags/v$1" 2>/dev/null)" ]
          }

          raw="${INPUT_VERSION:-}"
          mode="manual"
          publish="true"   # 手动触发（dispatch / tag）默认就是要发布
          if [ -z "$raw" ] && [ "${REF_TYPE:-}" = "tag" ]; then raw="${REF_NAME}"; fi

          if [ -z "$raw" ]; then
            # 自动模式：优先发「已写 notes 但尚未发布」的最高版本；
            # 若都已发布、但最高版本的 tag 还没建出来（上次卡在发布审批之类），只补 tag / Release。
            mode="auto"
            publish="false"
            mapfile -t versions < <(node -e '
              const fs = require("fs");
              const rx = /^release_notes_v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)\.md$/;
              const dir = "docs/releases";
              const files = fs.existsSync(dir) ? fs.readdirSync(dir) : [];
              const nums = (v) => v.split("-")[0].split(".").map(Number);
              files
                .map((f) => rx.exec(f))
                .filter(Boolean)
                .map((m) => m[1])
                .sort((a, b) => {
                  const x = nums(a), y = nums(b);
                  return y[0] - x[0] || y[1] - x[1] || y[2] - x[2];
                })
                .forEach((v) => console.log(v));
            ')
            for v in "${versions[@]:-}"; do
              [ -n "$v" ] || continue
              if ! published "$v"; then raw="$v"; publish="true"; break; fi
            done
            if [ -z "$raw" ]; then
              top="${versions[0]:-}"
              if [ -n "$top" ] && ! tagged "$top"; then
                raw="$top"
                echo "flint-skills-hub@$top is on npm but tag v$top is missing — creating tag / Release only."
              fi
            fi
            if [ -z "$raw" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "All release notes are published and tagged — nothing to release."
              exit 0
            fi
            echo "Auto-detected release target: v${raw#v} (publish=${publish})"
          fi

          version="${raw#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid version '$raw'. Expected semver like 1.0.0 or 1.1.0-rc.1"
            exit 1
          fi

          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "mode=$mode" >> "$GITHUB_OUTPUT"
            echo "publish=$publish" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
            echo "dry-run: resolved version $version, skipping npm state checks."
            exit 0
          fi

          if [ "$publish" = "true" ] && published "$version"; then
            if [ "$mode" = "manual" ]; then
              echo "::error::flint-skills-hub@${version} is already published on npm; bump the version."
              exit 1
            fi
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "flint-skills-hub@${version} is already published — nothing to release."
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $version (mode: $mode, publish: $publish)"

      - name: Nothing to release
        if: steps.version.outputs.skip == 'true'
        run: |
          echo "Skipped: no unpublished release notes — nothing to publish."

      - name: Require reviewed release notes
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          NOTES="docs/releases/release_notes_v${VERSION}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::Missing $NOTES — release notes must be written and reviewed before releasing (see docs/RELEASE.md)."
            exit 1
          fi
          {
            echo "## Release notes to be published (v${VERSION})"
            echo
            cat "$NOTES"
          } >> "$GITHUB_STEP_SUMMARY"

      # 发布用 manifest 与开发用 manifest 是两套：
      #   1. private:true 会让 npm 拒绝发布；
      #   2. tarball 的 files 白名单不含 server/ 与 client/ 的 package.json，
      #      留着 workspaces 会指向不存在的目录；
      #   3. 顶层 version 是仓库当前版本，发布时必须与 tag 对齐。
      # 只在 CI 的工作区里改写，仓库里的 package.json 保持开发形态。
      - name: Prepare publish manifest
        if: steps.version.outputs.skip != 'true' && steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm pkg delete private workspaces devDependencies
          npm pkg set version="$VERSION"
          echo "--- manifest to be published ---"
          cat package.json

      - name: Show package contents
        if: steps.version.outputs.skip != 'true' && steps.version.outputs.publish == 'true'
        run: npm pack --dry-run

      # 认证方式：默认走 OIDC，不需要任何 secret。
      # 唯一例外是首版引导——Trusted Publisher 是「包级」配置，包还没发布过时无处可配，
      # 所以允许用临时 NPM_TOKEN 先发一次；配好 OIDC 后必须删掉该 secret（见 docs/RELEASE.md §5）。
      - name: Publish to npm
        if: steps.version.outputs.skip != 'true' && steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            echo "dry-run: skipping npm publish (version ${VERSION})."
            exit 0
          fi
          if [ -n "$NPM_TOKEN" ]; then
            echo "::warning::Publishing with the temporary NPM_TOKEN secret (first-release bootstrap). Configure Trusted Publishing and remove this secret afterwards — see docs/RELEASE.md §5."
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$HOME/.npmrc"
          else
            echo "Publishing via OIDC trusted publishing (no NPM_TOKEN secret configured)."
          fi
          npm publish --provenance

      # 发布后确认新版本能从 registry 解析——**只告警，不阻断**。
      # 教训（两条方向相反的坑，都被踩过）：
      # 1. **不要用 `npm view`**：它读本地 npm 缓存，而紧邻的上一步「未发布探测」刚把 404 写进缓存，
      #    于是重试 60s 全在读同一个缓存（v0.1.1 实录：runner 上六次全 404，本机却早已可见）。
      #    这里直接查 registry API，并带 no-cache 头。
      # 2. **不能阻断**：npm 接单成功到公开可见之间有一段传播延迟，v1.0.0 实测约 8 分钟
      #    （发布步骤 07:11:50 跑完，registry 上的时间戳是 07:20:03）。任何「等两分钟还不出现就判死」
      #    的校验都会把正常发版判红，反而拦住 tag / Release。真正被拒的发布会让 `npm publish`
      #    以非 0 退出（重复版本 / 权限不足），那一步就已经拦住了，这里不需要再兜第二道。
      - name: Verify the published version resolves
        if: ${{ steps.version.outputs.skip != 'true' && steps.version.outputs.publish == 'true' && inputs.dry-run != true }}
        continue-on-error: true
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for attempt in $(seq 1 8); do
            if curl -fsS -H 'Cache-Control: no-cache' \
              "https://registry.npmjs.org/flint-skills-hub/${VERSION}" -o /dev/null; then
              echo "flint-skills-hub@${VERSION} resolves on the registry."
              exit 0
            fi
            echo "Attempt ${attempt}: not resolvable yet; retrying in 15s..."
            sleep 15
          done
          echo "::warning::flint-skills-hub@${VERSION} is not publicly resolvable yet (~2min after publish)."
          echo "::warning::This is normal propagation lag (v1.0.0 took about 8 minutes) and does not block the release; the tag / Release are still created."
          echo "::warning::If it is still missing after ~15 minutes, check for a publish awaiting approval or a duplicate-version rejection: https://www.npmjs.com/package/flint-skills-hub?activeTab=versions"

      # 建 tag / Release：publish=false 时也走这里（补 tag 的场景），因此只看 skip / dry-run
      # 打包排在「Prepare publish manifest」之后，保证 tarball 用的是发布版版本号。
      # files 用通配符：补 tag（publish=false）场景下不存在 tarball，glob 匹配不到即跳过，不会报错。
      - name: Pack npm tarball for Release asset
        if: ${{ steps.version.outputs.skip != 'true' && steps.version.outputs.publish == 'true' }}
        run: npm pack --silent

      # 同步发一份到 GitHub Packages（npm.pkg.github.com）。
      # 这是「仓库侧边栏 Packages 区会出现 npm 包卡片」的原因——GitHub 不会展示 npmjs.com 上的包。
      # 与 npmjs 是两套独立的镜像发布：npmjs 走 OIDC，这里用 Actions 自带 GITHUB_TOKEN（需 packages: write）。
      # GitHub npm registry 只接受 scoped 名，scope 必须等于仓库所属主（@lcy362/flint），版本沿用 npmjs 的同一版本。
      # 放在 `npm pack`（Release 资产）之后，避免改名影响 npmjs 侧的 tarball 文件名。
      - name: Publish to GitHub Packages (@lcy362/flint)
        if: ${{ steps.version.outputs.skip != 'true' && steps.version.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            echo "dry-run: skipping GitHub Packages publish."
            exit 0
          fi
          npm pkg set name="@lcy362/flint"
          {
            echo "@lcy362:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=${GH_TOKEN}"
          } >> "$HOME/.npmrc"
          npm publish

      - name: Create GitHub Release
        if: ${{ steps.version.outputs.skip != 'true' && inputs.dry-run != true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: docs/releases/release_notes_v${{ steps.version.outputs.version }}.md
          files: |
            flint-skills-hub-${{ steps.version.outputs.version }}.tgz
          draft: false
          prerelease: false
