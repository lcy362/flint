# F1 · 凭据泄漏规则（大小写敏感，故不带 i 标志）
#
# 由 scripts/gen-security-rules.mjs 生成 TS 常量。
# 密钥模式参考 gitleaks(MIT) 与各厂商公开的 token 前缀格式整理。

rules:
  - id: SECRET_OPENAI
    category: secret
    severity: warn
    flags: ''
    titleKey: sec.rule.openaiKey
    pattern: |-
      \bsk-(proj-[A-Za-z0-9_-]{20,}|[A-Za-z0-9]{20,})\b

  - id: SECRET_ANTHROPIC
    category: secret
    severity: warn
    flags: ''
    titleKey: sec.rule.anthropicKey
    pattern: |-
      \bsk-ant-[A-Za-z0-9_-]{20,}\b

  - id: SECRET_AWS_ACCESS_KEY
    category: secret
    severity: warn
    flags: ''
    titleKey: sec.rule.awsAccessKey
    pattern: |-
      \bAKIA[0-9A-Z]{16}\b

  - id: SECRET_GITHUB_PAT
    category: secret
    severity: warn
    flags: ''
    titleKey: sec.rule.githubPat
    pattern: |-
      \b(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36}\b

  - id: SECRET_GITHUB_PAT_FINE
    category: secret
    severity: warn
    flags: ''
    titleKey: sec.rule.githubPatFine
    pattern: |-
      \bgithub_pat_[A-Za-z0-9_]{22,}\b

  - id: SECRET_SLACK
    category: secret
    severity: warn
    flags: ''
    titleKey: sec.rule.slackToken
    pattern: |-
      \bxox[baprs]-[A-Za-z0-9-]{10,}\b

  - id: SECRET_GOOGLE_API
    category: secret
    severity: warn
    flags: ''
    titleKey: sec.rule.googleApiKey
    pattern: |-
      \bAIza[0-9A-Za-z_-]{35}\b

  - id: SECRET_STRIPE
    category: secret
    severity: warn
    flags: ''
    titleKey: sec.rule.stripeKey
    pattern: |-
      \b[rs]k_live_[A-Za-z0-9]{20,}\b

  - id: SECRET_NPM_TOKEN
    category: secret
    severity: warn
    flags: ''
    titleKey: sec.rule.npmToken
    pattern: |-
      \bnpm_[A-Za-z0-9]{36}\b

  - id: SECRET_PRIVATE_KEY
    category: secret
    severity: error
    flags: ''
    titleKey: sec.rule.privateKeyBlock
    pattern: |-
      -----BEGIN [A-Z ]{0,20}PRIVATE KEY-----

  - id: SECRET_GENERIC_ASSIGNMENT
    category: secret
    severity: warn
    flags: i
    titleKey: sec.rule.genericSecret
    minEntropy: 3
    pattern: |-
      \b(api[_-]?key|apikey|secret|token|password|passwd|access[_-]?key)\b\s*[:=]\s*["']?[A-Za-z0-9/_+.\-]{16,}
