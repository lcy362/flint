# SonarCloud 分析配置（CI 扫描用；自动分析不读本文件）
# 项目由「在 SonarQube 导入 GitHub 项目」建立，key / organization 沿用既有取值，
# 分析方式已从「自动分析」切换为「CI 扫描」，否则覆盖率无法上报。
sonar.projectKey=lcy362_flint
sonar.organization=sandgrid
sonar.projectName=flint
sonar.sourceEncoding=UTF-8

# 两个 workspace，各自是独立的源码根
sonar.sources=server/src,client/src

# 测试代码：单测目录（服务端在 tests/，前端在 tests/）
sonar.tests=server/tests,client/tests
sonar.test.inclusions=\
  server/tests/**/*.test.ts,\
  client/tests/**/*.test.ts,\
  client/tests/**/*.test.tsx

# 构建产物、依赖、覆盖率输出与测试文件都不参与源码分析
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  sonar-project.properties

# 覆盖率：两包各自产出 lcov；
# 包内脚本 scripts/prefix-lcov.mjs 已把 SF 路径改写成仓库根相对，Sonar 才能对上文件
sonar.javascript.lcov.reportPaths=\
  server/coverage/lcov.info,\
  client/coverage/lcov.info

# 覆盖率排除：这两个是进程 / 页面入口，只做装配（起 HTTP 服务、挂载 React 根），
# 由 smoke 与手工验证覆盖；保持与各包 vitest.config.ts 的 coverage.exclude 一致
sonar.coverage.exclusions=\
  server/src/index.ts,\
  client/src/main.tsx

# 语言包是两份结构同构、仅文案不同的字典，CPD 必然判为重复；
# 这是设计使然（见 client/src/i18n/index.tsx 的说明），按惯例排除出重复检测
sonar.cpd.exclusions=\
  client/src/i18n/**,\
  server/src/i18n/**
